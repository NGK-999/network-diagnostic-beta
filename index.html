<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Varredura de Proximidade</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="scan-shell">
    <header class="scan-header">
      <div>
        <p class="module-label">API BYPASS // SCRIPT V2.4</p>
        <h1>🔥 RADAR DE C-A-S-A-D-A-S (BETA RESTRITO) 🔥</h1>
      </div>
      <div class="system-status" aria-label="Status do sistema">
        <span>STATUS</span>
        <strong id="systemStatus">STANDBY</strong>
      </div>
    </header>

    <section class="control-panel" aria-label="Controle de varredura">
      <button id="scanButton" type="button">[ LOCALIZAR ALVOS NUM RAIO DE 5KM ]</button>
      <div class="readout">
        <span>GPS</span>
        <strong id="gpsStatus">AGUARDANDO PERMISSÃO</strong>
      </div>
      <div class="readout">
        <span>POSIÇÃO</span>
        <strong id="positionStatus">LAT --.----- // LON --.-----</strong>
      </div>
    </section>

    <section class="map-panel" aria-label="Mapa tático de proximidade">
      <div id="map"></div>
      <div class="crosshair" aria-hidden="true">
        <span class="scan-line horizontal"></span>
        <span class="scan-line vertical"></span>
        <span class="scan-ring outer"></span>
        <span class="scan-ring inner"></span>
        <span class="scan-core"></span>
      </div>
      <div class="sweep-grid" aria-hidden="true"></div>
    </section>

    <section class="terminal-panel" aria-label="Logs técnicos">
      <div class="terminal-title">
        <span>TERMINAL // INTERCEPTAÇÃO DE DADOS</span>
        <strong id="terminalStatus">IDLE</strong>
      </div>
      <div class="terminal-output" id="terminalOutput" role="log" aria-live="polite">
        <p class="log-line">Sistema em espera. Módulo de proximidade carregado.</p>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
