<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreamento de Encomendas Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="pageTitle">
      <p class="eyebrow">Express Logistics Network</p>
      <h1 id="pageTitle">Rastreamento de Encomendas Express</h1>
      <p class="summary">
        Interface de localizacao tática para identificar a area de entrega e simular o pacote em rota final.
      </p>
    </section>

    <section class="terminal-card" aria-label="Terminal de rastreamento">
      <div class="terminal-topbar">
        <span class="topbar-dot"></span>
        <span class="topbar-dot"></span>
        <span class="topbar-dot"></span>
        <strong>tracking-node:/express/reverse-gps</strong>
      </div>

      <div class="terminal-body">
        <button class="locate-button" id="locateButton" type="button">
          [ LOCALIZAR ENCOMENDA ]
        </button>

        <div class="terminal-output" id="terminalOutput" role="log" aria-live="polite"></div>
      </div>
    </section>

    <section class="map-panel hidden" id="mapPanel" aria-label="Mapa tatico da encomenda">
      <div class="map-status">
        <span>GPS: ONLINE</span>
        <span>ROTA: CALCULADA</span>
        <span>STATUS: APROXIMACAO FINAL</span>
      </div>
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
